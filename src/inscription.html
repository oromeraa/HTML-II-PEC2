<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />
    <!-- do not remove this line! -->
    <title>Inscríbete — Jornadas de Artesanía de Sabero</title>
  </head>
  <body class="inscription">
    <include src="./views/header.html"></include>

    <main class="inscription-page">
      <div class="container">
        <div class="inscription-page__header">
          <h1 class="inscription-page__title">Inscríbete</h1>
          <p class="inscription-page__intro">
            Rellena el formulario y te confirmamos la inscripción por correo.
          </p>
        </div>

        <form
          name="inscripcio-tallers"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
          class="inscription-form"
          novalidate
        >
          <input type="hidden" name="form-name" value="inscripcio-tallers" />

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo *</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="form-control"
              required
            />
            <div class="invalid-feedback">Por favor, introduce tu nombre.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico *</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              required
            />
            <div class="invalid-feedback">Introduce un email válido.</div>
          </div>

          <div class="mb-3">
            <label for="taller" class="form-label">Taller de interés *</label>
            <select id="taller" name="taller" class="form-select" required>
              <option value="" disabled selected>Selecciona un taller…</option>
              <option value="torno">Iniciación al torno (María López)</option>
              <option value="tenido">Teñido natural (Sara Puig)</option>
              <option value="vidrio">
                Demostración de vidrio (Àlex Ferrer)
              </option>
            </select>
            <div class="invalid-feedback">Selecciona un taller.</div>
          </div>

          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje o consulta</label>
            <textarea
              id="mensaje"
              name="mensaje"
              class="form-control"
              rows="4"
            ></textarea>
          </div>

          <div class="mb-3 form-check">
            <input
              type="checkbox"
              id="privacidad"
              name="privacidad"
              class="form-check-input"
              required
            />
            <label for="privacidad" class="form-check-label">
              Acepto la <a href="#">política de privacidad</a>.
            </label>
            <div class="invalid-feedback">
              Debes aceptar la política de privacidad.
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i> Enviar inscripción
          </button>
        </form>
      </div>
    </main>

    <include src="./views/footer.html"></include>
    <script type="module" src="./assets/scripts/main.js"></script>
    <!-- do not remove this line! -->
  </body>
</html>
